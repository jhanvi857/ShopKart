global:
  scrape_interval: 2s
  evaluation_interval: 2s
  external_labels:
    company: shopkart
    environment: production

scrape_configs:
  - job_name: 'edge-gateway'
    static_configs:
      - targets: ['host.docker.internal:9000']
    metrics_path: '/metrics'

  - job_name: 'catalog'
    static_configs:
      - targets: ['host.docker.internal:9001']
    metrics_path: '/metrics'

  - job_name: 'search'
    static_configs:
      - targets: ['host.docker.internal:9002']
    metrics_path: '/metrics'

  - job_name: 'checkout'
    static_configs:
      - targets: ['host.docker.internal:9003']
    metrics_path: '/metrics'

  - job_name: 'inventory'
    static_configs:
      - targets: ['host.docker.internal:9004']
    metrics_path: '/metrics'

  - job_name: 'payments'
    static_configs:
      - targets: ['host.docker.internal:9005']
    metrics_path: '/metrics'

  - job_name: 'cart'
    static_configs:
      - targets: ['host.docker.internal:9006']
    metrics_path: '/metrics'

  - job_name: 'notifications'
    static_configs:
      - targets: ['host.docker.internal:9007']
    metrics_path: '/metrics'

  - job_name: 'external-bank-mock'
    static_configs:
      - targets: ['host.docker.internal:9008']
    metrics_path: '/metrics'

  - job_name: 'reviews'
    static_configs:
      - targets: ['host.docker.internal:9009']
    metrics_path: '/metrics'
